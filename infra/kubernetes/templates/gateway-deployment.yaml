apiVersion: apps/v1
kind: Deployment
metadata:
  name: vanguard-gateway
  labels:
    app: vanguard-gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: vanguard-gateway
  template:
    metadata:
      labels:
        app: vanguard-gateway
    spec:
      containers:
        - name: gateway
          image: {{ .Values.gateway.image }}
          ports:
            - containerPort: {{ .Values.gateway.port }}
            - containerPort: {{ .Values.gateway.udpPort }}
              protocol: UDP
          envFrom:
            - configMapRef:
                name: vanguard-gateway-config
          resources:
            requests:
              cpu: {{ .Values.gateway.resources.requests.cpu }}
              memory: {{ .Values.gateway.resources.requests.memory }}
            limits:
              cpu: {{ .Values.gateway.resources.limits.cpu }}
              memory: {{ .Values.gateway.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: {{ .Values.gateway.port }}
            initialDelaySeconds: 10
            periodSeconds: 20
