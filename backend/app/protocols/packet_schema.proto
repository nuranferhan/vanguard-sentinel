syntax = "proto3";

package vanguard;

message GamePacket {
  string client_id = 1;
  string session_id = 2;
  string action_type = 3;
  bytes payload = 4;
  int64 sequence_id = 5;
  double timestamp = 6;
  string nonce = 7;
}

message GamePacketAck {
  bool accepted = 1;
  string reason = 2;
  int64 server_tick = 3;
}
